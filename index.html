<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>GameZone</title>
    <!-- 초기값만. 실제 색은 chrome-sync.ts 가 앱이 칠한 배경에서 읽어 덮어쓴다. -->
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS 는 manifest 를 거의 안 보고 이 메타들을 본다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GameZone" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <style>
      /*
       * 2048 보드 위에서만 브라우저의 패닝(스크롤)을 끈다.
       *
       * 보드는 TouchableOpacity 의 onPressIn/onPressOut 으로 시작·끝 좌표만 읽어
       * 스와이프를 판정한다(Game2048Board.tsx). PanResponder 가 아니라서 브라우저에
       * "이 제스처는 앱이 쓴다"고 알릴 방법이 없고, 그대로 두면 위/아래 드래그를
       * 브라우저가 스크롤로 가로채며 pointercancel 을 던진다 — onPressOut 이 오지
       * 않아 위·아래 스와이프가 통째로 죽는다.
       *
       * 그래도 이 규칙은 **판에만** 건다. 예전에 문서 스크롤을 통째로 막았다가
       * 게임 목록의 아래쪽 카드에 닿을 수 없게 된 적이 있다. 지금은 아래의
       * `#root { display: flex }` 덕분에 목록이 FlatList 안에서 스크롤되지만,
       * 좁게 거는 편이 여전히 옳다 — 스크롤을 막을 이유가 있는 곳은 판뿐이다.
       */
      [data-testid="game-2048-board"] { touch-action: none; }

      html, body, #root { height: 100%; margin: 0; }
      /*
       * 문서를 아예 못 움직이게 못 박는다 — iOS 의 고무줄(러버밴드) 제거.
       *
       * 빈 곳을 위아래로 끌면 스크롤은 안 되는데 화면 전체가 들렸다 돌아온다.
       * 스크롤이 아니라 **문서 자체의 바운스**라서 `overscroll-behavior: none`
       * 으로는 안 잡힌다 — iOS Safari 는 그 속성을 문서 루트의 바운스에는
       * 적용하지 않는다. 확실히 막는 방법은 `position: fixed` 로 문서를 뷰포트에
       * 박아, 움직일 여지 자체를 없애는 것이다.
       *
       * 예전엔 이렇게 못 했다. 게임 목록이 문서 스크롤에 기대고 있어서 막으면
       * 아래쪽 카드에 닿을 수 없었다. 지금은 `#root { display: flex }` 로 루트가
       * 뷰포트에 묶여 목록이 FlatList 안에서 스크롤되므로, 문서 스크롤은 아무도
       * 쓰지 않는다 — 그래서 이제 잠글 수 있다.
       *
       * `overscroll-behavior` 도 html 까지 올린다. iOS 밖(안드로이드 Chrome)에서는
       * 이 속성이 먹고, 안쪽 스크롤이 끝에 닿았을 때 문서로 번지는 것을 막는다.
       */
      html, body { overscroll-behavior: none; }
      body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
      /*
       * `#root` 를 flex 컨테이너로 만든다 — 한 줄이지만 화면이 넘치느냐 마느냐를
       * 여기서 가른다.
       *
       * `height: 100%` 만 주면 #root 자신은 뷰포트 높이지만, `display: block` 인
       * 부모 안에서 자식(react-native-web 의 앱 컨테이너)의 높이는 auto 가 된다.
       * 그 자식이 `flex: 1` 을 달고 있어도 부모가 flex 컨테이너가 아니면 아무
       * 의미가 없어서, 앱 트리 전체가 내용 높이만큼 자란 뒤 #root 를 넘쳐 흐른다.
       * 그 결과 `flex: 1, minHeight: 0` 을 단 판이 **줄어들 이유를 못 찾는다** —
       * 위에서 내려오는 높이 제한이 애초에 없기 때문이다(375×586 에서 실측:
       * #root 586, 앱 컨테이너 686).
       *
       * 진짜 기기에서는 네이티브 루트가 화면에 묶여 있어 이 문제가 없다. 웹
       * 하네스에만 있던 구멍이고, 막으면 판이 남은 공간에 맞게 줄어든다.
       *
       * 목록 화면은 FlatList(자체 스크롤 컨테이너)라 문서 스크롤을 잃어도
       * 안쪽에서 스크롤된다 — 네이티브와 같은 방식이 된다.
       */
      #root { display: flex; flex-direction: column; }
      /* 배경은 chrome-sync.ts 가 앱 색으로 덮어쓴다 — 여기 값은 첫 페인트용이다. */
      body { background: #fff; -webkit-tap-highlight-color: transparent; }
      /* 폰에서는 화면을 꽉 채우고, 넓은 화면에서만 기기 폭으로 가둔다 */
      #root { width: 100%; }
      @media (min-width: 520px) {
        #root { width: 402px; margin: 0 auto; box-shadow: 0 0 0 1px #ddd; }
      }
    </style>
